name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Compile all Python sources
        run: python -m compileall -q src

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Tests (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          python -m pytest tests -q --tb=short 2>&1 | tee pytest.log

      - name: Publish pytest failures
        if: failure()
        run: |
          {
            echo '### Pytest output'
            echo '```'
            tail -200 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          from pathlib import Path
          log = Path("pytest.log")
          text = log.read_text(errors="replace") if log.exists() else "pytest.log missing"
          msg = "\n".join(text.strip().splitlines()[-40:])
          msg = msg.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Pytest failure::{msg}")
          PY
