[project]
name = "gamohud"
version = "0.2.1"
description = "Gamohud - standalone performance overlay and app launcher (no MangoHud required)"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.2",
    "psutil>=6.1.0",
    "PySide6-Essentials>=6.5",
]

[project.optional-dependencies]
# Read CPU/GPU temperatures and sensors on Windows (needs LibreHardwareMonitor
# or ACPI thermal zones). Optional: gamohud works without it, showing N/A.
windows = [
    "wmi>=1.5.1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B008", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]

